# 🧪 Gatling Configuration
# This file contains configuration properties for Gatling performance tests

gatling {
  # Simulation Base URL
  # Override with: -DbaseUrl=http://your-server:port
  baseUrl = "http://localhost:8080"

  # BasicLoadTest default values
  basicLoad {
    users = 50
    rampDuration = 30
    testDuration = 120
  }

  # StressTest default values
  stress {
    initialUsers = 10
    maxUsers = 200
    incrementUsers = 10
    stepDuration = 30
  }

  # SpikeTest default values
  spike {
    normalLoad = 10
    spikeLoad = 200
    spikeDuration = 60
  }

  # EnduranceTest default values (in minutes)
  endurance {
    constantUsers = 50
    testDuration = 120
  }

  # DatabaseIntensiveTest default values (in minutes)
  dbIntensive {
    users = 30
    duration = 10
  }

  # Report Configuration
  charting {
    indicators {
      lowerBound = 800
      higherBound = 1200
    }
  }

  # Performance Thresholds
  assertions {
    responseTime {
      mean = 1000
      p95 = 2000
    }
    successRate = 95
  }
  
  # HTTP Configuration
  http {
    requestTimeout = 120000  # 120 seconds timeout for HTTP requests
  }
}