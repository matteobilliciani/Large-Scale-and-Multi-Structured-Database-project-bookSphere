spring.application.name=BookSphere

# Active Spring Profile - Using WSL Cluster Configuration
spring.profiles.active=cluster

#Connection to the DBS used in the project

# MongoDB: replace with your connection string if you are using the local instance of BookSphere
spring.data.mongodb.uri = mongodb+srv://admin:admin@booksphere.nzqkgkj.mongodb.net/BookSphere?retryWrites=true&w=majority

# Neo4j: I'm using the local instance, change it otherwise
spring.neo4j.uri = neo4j://localhost:7687
spring.neo4j.authentication.username = neo4j
spring.neo4j.authentication.password = password

spring.data.neo4j.database = booksphere

management.endpoint.health.show-details = always

# JWT Configuration
# Secret key should be at least 256 bits (32 bytes) for HS256
# This is a sample key - CHANGE IT IN PRODUCTION!
jwt.secret = 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiration: 24 hours in milliseconds
jwt.expiration = 86400000
jwt.issuer = bookSphere
