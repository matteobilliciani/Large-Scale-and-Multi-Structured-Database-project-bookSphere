# MongoDB Configuration (WSL Cluster)
# Stringa di connessione che include i 3 nodi, il nome del set e le politiche di coerenza
spring.data.mongodb.uri=mongodb://localhost:27017,localhost:27018,localhost:27019/booksphere?replicaSet=myReplicaSet&readPreference=secondaryPreferred&w=majority&readConcernLevel=majority

# Opzionale: puoi rimuovere la riga sotto se usi la URI sopra, 
# poiché il database 'booksphere' è già specificato nel percorso della URI.
# spring.data.mongodb.database=booksphere

# Note importanti per il tuo progetto Spring:
# 
#     Transazioni: Se nel tuo codice Java usi @Transactional, Spring ignorerà il readPreference=secondaryPreferred all'interno della transazione e userà sempre il Primary per garantire la coerenza (Read-your-own-writes). Questo è il comportamento corretto e desiderato.
# 
#     Performance: Spostando le letture sui secondari (secondaryPreferred), potresti notare un leggerissimo ritardo (millisecondi) nel vedere un dato appena scritto (eventual consistency), a meno che tu non usi appunto il readConcern=majority.
# 
#     Neo4j: Nota che l'IP di Neo4j che hai inserito (172.28.78.198) è l'IP interno di WSL. Ricorda che questo IP cambia ogni volta che riavvii Windows/WSL. Se vuoi evitare di aggiornarlo sempre, puoi provare a usare localhost:7687 (se il port forwarding di WSL funziona correttamente) o creare uno script che aggiorna l'IP in automatico.

# Neo4j Configuration (WSL) - Using WSL IP address
spring.neo4j.uri=neo4j://172.28.78.198:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password
spring.data.neo4j.database=neo4j

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.neo4j.driver=DEBUG
logging.level.it.unipi.bookSphere=DEBUG

management.endpoint.health.show-details = always

# JWT Configuration
# Secret key should be at least 256 bits (32 bytes) for HS256
# This is a sample key - CHANGE IT IN PRODUCTION!
jwt.secret = 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Token expiration: 24 hours in milliseconds
jwt.expiration = 86400000
jwt.issuer = bookSphere